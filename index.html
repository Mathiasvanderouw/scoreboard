<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f13;--surface:#1a1a20;--surface2:#22222a;--border:#2a2a35;--accent:#4fc3f7;--text:#f0f0f2;--muted:#6b6b80;--radius:10px;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;padding:2rem 1rem 3rem;}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent);text-align:center;margin-bottom:.2rem;}
.sub{text-align:center;font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:1.75rem;}
.preview-wrap{background:#d0d0d0;border-radius:12px;padding:28px 20px;display:flex;justify-content:center;margin-bottom:1.75rem;overflow:hidden;}
canvas{display:block;max-width:100%;height:auto;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem;max-width:780px;margin-left:auto;margin-right:auto;}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:.5rem;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
.team-col{display:flex;flex-direction:column;gap:.75rem;}
label{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px;}
input[type=text],input[type=number]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:.9rem;padding:7px 11px;outline:none;transition:border-color .15s;}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);}
.logo-area{border:1.5px dashed var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;position:relative;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.logo-area:hover{border-color:var(--accent);background:rgba(79,195,247,.04);}
.logo-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.logo-area img{width:42px;height:42px;object-fit:contain;border-radius:4px;}
.hint{font-size:.68rem;color:var(--muted);}
.flag-strips{display:flex;flex-direction:column;gap:5px;margin-top:4px;}
.strip-row{display:flex;align-items:center;gap:8px;}
.strip-swatch{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.15);flex-shrink:0;}
.strip-row input[type=color]{width:32px;height:32px;border-radius:5px;border:1px solid var(--border);background:none;cursor:pointer;padding:2px;}
.add-btn,.rem-btn{padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);font-size:.68rem;cursor:pointer;transition:all .15s;}
.add-btn{color:var(--accent);margin-top:5px;display:inline-block;}
.add-btn:hover{background:rgba(79,195,247,.1);}
.rem-btn{color:var(--muted);}
.rem-btn:hover{border-color:#e24b4a;color:#e24b4a;}
.score-row{display:flex;align-items:center;gap:10px;}
.score-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.score-btn:hover{background:var(--border);border-color:var(--accent);}
.score-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2rem;min-width:36px;text-align:center;color:var(--text);}
.time-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.time-row input[type=number]{width:70px;}
.time-sep{color:var(--muted);font-size:1.2rem;font-weight:700;}
.btn{padding:8px 18px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Barlow',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn:hover{background:var(--border);border-color:var(--accent);}
.btn.running{border-color:#1D9E75;color:#1D9E75;}
.league-row{display:flex;gap:1rem;align-items:flex-start;}
.league-row>div:first-child{flex:1;}
.btn-export{display:block;width:100%;max-width:780px;margin:1.25rem auto 0;padding:13px;border-radius:var(--radius);border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .15s;}
.btn-export:hover{background:rgba(79,195,247,.08);}
@media(max-width:540px){.two-col{grid-template-columns:1fr;}.league-row{flex-direction:column;}}
</style>
</head>
<body>
<h1>Scoreboard Generator</h1>
<p class="sub">Professional match graphics — export PNG</p>
<div class="preview-wrap"><canvas id="sb" width="1800" height="220"></canvas></div>
<div class="panel">
  <div class="panel-title">Teams</div>
  <div class="two-col">
    <div class="team-col">
      <div><label>Home team name</label><input type="text" id="name-home" value="NAC" maxlength="12" oninput="redraw()"></div>
      <div><label>Home logo</label><div class="logo-area"><img id="prev-home" src="" style="display:none;"><span class="hint" id="hint-home">Click to upload</span><input type="file" accept="image/*" onchange="loadLogo('home',this)"></div></div>
      <div><label>Home flag stripes</label><div class="flag-strips" id="strips-home"></div><button class="add-btn" onclick="addStrip('home')">+ stripe</button></div>
    </div>
    <div class="team-col">
      <div><label>Away team name</label><input type="text" id="name-away" value="DAN" maxlength="12" oninput="redraw()"></div>
      <div><label>Away logo</label><div class="logo-area"><img id="prev-away" src="" style="display:none;"><span class="hint" id="hint-away">Click to upload</span><input type="file" accept="image/*" onchange="loadLogo('away',this)"></div></div>
      <div><label>Away flag stripes</label><div class="flag-strips" id="strips-away"></div><button class="add-btn" onclick="addStrip('away')">+ stripe</button></div>
    </div>
  </div>
</div>
<div class="panel">
  <div class="panel-title">Score</div>
  <div class="two-col">
    <div><label>Home</label><div class="score-row"><button class="score-btn" onclick="addScore('home',-1)">−</button><span class="score-val" id="disp-home">0</span><button class="score-btn" onclick="addScore('home',1)">+</button></div></div>
    <div><label>Away</label><div class="score-row"><button class="score-btn" onclick="addScore('away',-1)">−</button><span class="score-val" id="disp-away">0</span><button class="score-btn" onclick="addScore('away',1)">+</button></div></div>
  </div>
</div>
<div class="panel">
  <div class="panel-title">Cronometer</div>
  <div class="time-row">
    <input type="number" id="inp-min" min="0" max="120" value="0" oninput="setTime()">
    <span class="time-sep">:</span>
    <input type="number" id="inp-sec" min="0" max="59" value="0" oninput="setTime()">
    <button class="btn" id="tick-btn" onclick="toggleTick()">▶ Start</button>
    <button class="btn" onclick="resetAll()">Reset</button>
  </div>
</div>
<button class="btn-export" onclick="exportPNG()">⬇ Download PNG</button>

function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function loadLogo(side,input){
  const file=input.files[0];if(!file)return;
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{logos[side]=img;const p=document.getElementById('prev-'+side);const h=document.getElementById('hint-'+side);p.src=url;p.style.display='block';if(h)h.style.display='none';redraw();};
  img.src=url;
}
function buildUI(side){
  const el=document.getElementById('strips-'+side);el.innerHTML='';
  strips[side].forEach((s,i)=>{
    const row=document.createElement('div');row.className='strip-row';
    row.innerHTML=`<div class="strip-swatch" style="background:${s.c}"></div><input type="color" value="${s.c}" oninput="updateStrip('${side}',${i},this.value)"><button class="rem-btn" onclick="removeStrip('${side}',${i})">✕</button>`;
    el.appendChild(row);
  });
}
function addStrip(side){strips[side].push({c:'#aaaaaa'});buildUI(side);redraw();}
function removeStrip(side,i){if(strips[side].length<=1)return;strips[side].splice(i,1);buildUI(side);redraw();}
function updateStrip(side,i,val){strips[side][i].c=val;document.querySelectorAll(`#strips-${side} .strip-swatch`)[i].style.background=val;redraw();}

function drawFlag(x,y,w,h,colors){
  const n=colors.length,sh=h/n;
  colors.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(x,y+i*sh,w,sh+1);});
}
function drawLogo(side,x,y,size){
  if(logos[side]){
    ctx.save();ctx.beginPath();rrPath(x,y,size,size,size*0.1);ctx.clip();
    ctx.drawImage(logos[side],x,y,size,size);ctx.restore();
  } else {
    const name=(document.getElementById('name-'+side).value||'?').slice(0,3).toUpperCase();
    ctx.fillStyle=side==='home'?'#003893':'#eeeeee';
    ctx.beginPath();rrPath(x,y,size,size,size*0.1);ctx.fill();
    ctx.fillStyle=side==='home'?'#ffffff':'#111111';
    ctx.font=`bold ${Math.round(size*0.3)}px 'Barlow Condensed',Arial`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(name,x+size/2,y+size/2);
  }
}
function rrPath(x,y,w,h,r){
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function redraw(){
  ctx.clearRect(0,0,W,H);
  const PAD=8,R=12;
  // White pill — no border
  ctx.fillStyle='#ffffff';ctx.beginPath();rrPath(PAD,PAD,W-PAD*2,H-PAD*2,R);ctx.fill();

  const SEP='rgba(0,0,0,0.1)';
  const logoSz=Math.round(H*0.6);
  const logoY=H/2-logoSz/2;
  const flagW=13,flagH=H*0.62,flagY=H/2-flagH/2;

  // ===== LEFT SECTION: SCORES =====
  const scoreW=280;
  // "Resultado" label
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.font=`400 ${Math.round(H*0.1)}px 'Barlow Condensed',Arial`;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText('RESULTADO',PAD+scoreW/2,PAD+10);

  // Score numbers
  const scoreY=H/2+6;
  ctx.fillStyle='#111111';
  ctx.font=`900 ${Math.round(H*0.44)}px 'Barlow Condensed',Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(scores.home,PAD+scoreW*0.32,scoreY);
  ctx.fillText(scores.away,PAD+scoreW*0.68,scoreY);

  // Blue pipe divider between scores
  ctx.strokeStyle='#4fc3f7';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(PAD+scoreW/2,H/2-H*0.24);ctx.lineTo(PAD+scoreW/2,H/2+H*0.24);ctx.stroke();

  // Vertical divider after scores
  ctx.strokeStyle=SEP;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(PAD+scoreW,PAD+18);ctx.lineTo(PAD+scoreW,H-PAD-18);ctx.stroke();

  // ===== HOME TEAM =====
  const homeStartX=PAD+scoreW+16;
  drawFlag(homeStartX,flagY,flagW,flagH,strips.home.map(s=>s.c));
  const homeLX=homeStartX+flagW+16;
  drawLogo('home',homeLX,logoY,logoSz);
  const homeName=(document.getElementById('name-home').value||'HOME').toUpperCase();
  ctx.fillStyle='#111111';
  ctx.font=`900 ${Math.round(H*0.3)}px 'Barlow Condensed',Arial`;
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(homeName,homeLX+logoSz+18,H/2+2);

  // Chevron home → right
  const homeNameW=ctx.measureText(homeName).width;
  const chevX=homeLX+logoSz+18+homeNameW+16;
  const chevTip=20,chevPad=PAD+6;
  ctx.fillStyle='rgba(0,0,0,0.025)';ctx.strokeStyle='rgba(0,0,0,0.07)';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(chevX-8,chevPad);ctx.lineTo(chevX-8+chevTip,H/2);ctx.lineTo(chevX-8,H-chevPad);
  ctx.lineTo(chevX,H-chevPad);ctx.lineTo(chevX+chevTip,H/2);ctx.lineTo(chevX,chevPad);
  ctx.closePath();ctx.fill();ctx.stroke();

  // ===== CENTER: LIGA AUF LOGO =====
  const cx=W/2;
  const ligaH=H*0.72,ligaW=ligaH*(ligaImg.naturalWidth||930)/(ligaImg.naturalHeight||1200);
  ctx.drawImage(ligaImg,cx-ligaW/2,H/2-ligaH/2,ligaW,ligaH);

  // ===== AWAY TEAM =====
  const rightScoreW=280;
  const awayEndX=W-PAD-rightScoreW-16;
  const awayName=(document.getElementById('name-away').value||'AWAY').toUpperCase();
  ctx.font=`900 ${Math.round(H*0.3)}px 'Barlow Condensed',Arial`;
  const awayNameW=ctx.measureText(awayName).width;
  const awayLX=awayEndX-flagW-18-logoSz;
  const awayNameX=awayLX-awayNameW-18;

  // Chevron away ← left
  const achX=awayNameX-16;
  ctx.fillStyle='rgba(0,0,0,0.025)';ctx.strokeStyle='rgba(0,0,0,0.07)';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(achX+8,chevPad);ctx.lineTo(achX+8-chevTip,H/2);ctx.lineTo(achX+8,H-chevPad);
  ctx.lineTo(achX,H-chevPad);ctx.lineTo(achX-chevTip,H/2);ctx.lineTo(achX,chevPad);
  ctx.closePath();ctx.fill();ctx.stroke();

  ctx.fillStyle='#111111';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(awayName,awayNameX,H/2+2);
  drawLogo('away',awayLX,logoY,logoSz);
  drawFlag(awayLX+logoSz+12,flagY,flagW,flagH,strips.away.map(s=>s.c));

  // Vertical divider before right score section
  ctx.strokeStyle=SEP;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W-PAD-rightScoreW,PAD+18);ctx.lineTo(W-PAD-rightScoreW,H-PAD-18);ctx.stroke();

  // ===== RIGHT SECTION: CRONOMETER =====
  // "Minuto" label
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.font=`400 ${Math.round(H*0.1)}px 'Barlow Condensed',Arial`;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText('MINUTO',W-PAD-rightScoreW/2,PAD+10);

  ctx.fillStyle='#111111';
  ctx.font=`900 ${Math.round(H*0.37)}px 'Barlow Condensed',Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(fmt(totalSec),W-PAD-rightScoreW/2,H/2+4);
}

function addScore(side,d){scores[side]=Math.max(0,scores[side]+d);document.getElementById('disp-'+side).textContent=scores[side];redraw();}
function setTime(){const m=parseInt(document.getElementById('inp-min').value)||0;const s=parseInt(document.getElementById('inp-sec').value)||0;totalSec=m*60+Math.min(s,59);redraw();}
function toggleTick(){
  const btn=document.getElementById('tick-btn');
  if(ticker){clearInterval(ticker);ticker=null;btn.textContent='▶ Start';btn.className='btn';}
  else{ticker=setInterval(()=>{totalSec++;redraw();},1000);btn.textContent='⏸ Pause';btn.className='btn running';}
}
function resetAll(){
  if(ticker){clearInterval(ticker);ticker=null;}
  scores={home:0,away:0};totalSec=0;
  document.getElementById('disp-home').textContent='0';document.getElementById('disp-away').textContent='0';
  document.getElementById('inp-min').value=0;document.getElementById('inp-sec').value=0;
  document.getElementById('tick-btn').textContent='▶ Start';document.getElementById('tick-btn').className='btn';
  redraw();
}
function exportPNG(){
  const link=document.createElement('a');
  link.download='scoreboard_'+fmt(totalSec).replace(':','-')+'.png';
  link.href=C.toDataURL('image/png');link.click();
}
ligaImg.onload=()=>redraw();
buildUI('home');buildUI('away');redraw();
</script>
